name: 'Sync docs to GitHub Wiki'
description: 'Rewrite docs/ links to /wiki/{slug} URLs + auto-generate _Sidebar.md + push to the caller repo''s GitHub Wiki. Handles basename collisions by subdir-prefixing the slug.'
author: 'MobileByteLabs'
branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  docs-dir:
    description: 'Source docs directory in the caller repo (relative path).'
    required: false
    default: 'docs'
  sidebar-mode:
    description: 'auto (generate _Sidebar.md if absent) | consumer-authored (require docs/_Sidebar.md, fail otherwise) | none (skip sidebar entirely).'
    required: false
    default: 'auto'
  token:
    description: 'GITHUB_TOKEN with contents:write permission on the wiki repo. Composite actions must receive the token explicitly (cannot read secrets.GITHUB_TOKEN directly).'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Rewrite docs/ links → /wiki/ URLs (build .wiki-build/)
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        SIDEBAR_MODE: ${{ inputs.sidebar-mode }}
      run: |
        python3 "${{ github.action_path }}/.github/scripts/rewrite-wiki-links.py" \
          "${{ inputs.docs-dir }}" .wiki-build

    - name: Smoke test — rewrite produced expected output
      shell: bash
      run: |
        if [ ! -d .wiki-build ] || [ -z "$(ls -A .wiki-build)" ]; then
          echo "::error::.wiki-build/ missing or empty — rewriter failed silently"
          exit 1
        fi
        if ! grep -rqE "https://github\.com/.+/wiki/[A-Za-z0-9._-]+" .wiki-build/; then
          echo "::warning::No rewritten /wiki/ links found in .wiki-build/. Either docs/ has zero in-tree .md links or the rewriter is broken."
        fi
        if [ "${{ inputs.sidebar-mode }}" = "consumer-authored" ] && [ ! -f .wiki-build/_Sidebar.md ]; then
          echo "::error::sidebar-mode=consumer-authored requires docs/_Sidebar.md (not found in .wiki-build/)"
          exit 1
        fi
        echo "Wiki build verified ✓"

    - name: Push .wiki-build/ to wiki
      uses: Andrew-Chen-Wang/github-wiki-action@v4
      with:
        path: .wiki-build
        token: ${{ inputs.token }}
